name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Vet
        shell: bash
        run: |
          set +e
          go vet ./... > /tmp/coffer-vet.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then sed 's/^/::error::VET: /' /tmp/coffer-vet.log | head -15; fi
          exit "$status"
      - name: Test (unit + golden e2e against real git)
        shell: bash
        run: |
          set +e
          go test ./... -v > /tmp/coffer-test.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            { grep -E '^(--- FAIL|# |FAIL|panic:|fatal)|_test\.go:[0-9]+:' /tmp/coffer-test.log | head -10
              echo ---TAIL---
              tail -6 /tmp/coffer-test.log
            } | sed 's/^/::error::TEST: /'
          fi
          exit "$status"
      - name: Cross-builds
        shell: bash
        run: |
          go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
