name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        shell: bash
        run: |
          set +e
          go vet ./... > /tmp/coffer-vet.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then sed 's/^/::error::VET: /' /tmp/coffer-vet.log | head -15; fi
          exit "$status"
      - name: Test (unit + golden e2e against real git)
        shell: bash
        run: |
          set +e
          go test ./... -v > /tmp/coffer-test.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            { grep -E '^(--- FAIL|# |FAIL|panic:|fatal)|_test\.go:[0-9]+:' /tmp/coffer-test.log | head -10
              echo ---TAIL---
              tail -6 /tmp/coffer-test.log
            } | sed 's/^/::error::TEST: /'
          fi
          exit "$status"
      - name: Test with the race detector
        # The race detector needs a C toolchain everywhere but Linux;
        # one fully-instrumented leg catches what the fast legs miss.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go test -race ./... -count=1
      - name: Vulnerability scan (govulncheck)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Cross-builds
        shell: bash
        run: |
          go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...

  # The supported git floor is 2.30 (the first release with the helper
  # object-format capability) — this leg builds git 2.30.0 from source
  # and runs the whole suite against it, so the claim is tested, not
  # asserted.
  floor-git-230:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-bookworm
    steps:
      - name: Build git 2.30.0 from source
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl make gcc zlib1g-dev xz-utils
          curl -fsSL https://www.kernel.org/pub/software/scm/git/git-2.30.0.tar.xz \
            -o /tmp/git.tar.xz
          tar -xJf /tmp/git.tar.xz -C /tmp
          # Minimal feature set: the suite exercises local and helper
          # transports only, so OpenSSL and curl are unnecessary — and
          # building without them avoids git-2.30-vs-modern-OpenSSL 3
          # incompatibilities.
          make -C /tmp/git-2.30.0 -j"$(nproc)" \
            NO_TCLTK=1 NO_GETTEXT=1 NO_OPENSSL=1 NO_CURL=1 \
            prefix=/usr/local >/tmp/git-build.log 2>&1
          make -C /tmp/git-2.30.0 \
            NO_TCLTK=1 NO_GETTEXT=1 NO_OPENSSL=1 NO_CURL=1 \
            prefix=/usr/local install >/dev/null
          /usr/local/bin/git --version
          case "$(/usr/local/bin/git --version)" in *"version 2.30."*) ;; *) echo "unexpected git version"; exit 1 ;; esac
      - uses: actions/checkout@v5
      - name: Full suite against git 2.30
        shell: bash
        run: |
          set +e
          export PATH=/usr/local/bin:"$PATH"   # the freshly built 2.30 first
          git --version
          go test ./... -count=1 > /tmp/floor.log 2>&1
          status=$?
          set -e
          cat /tmp/floor.log || true
          exit "$status"
      - name: Cross-builds
        shell: bash
        run: |
          export PATH=/usr/local/bin:"$PATH"
          go build ./...
