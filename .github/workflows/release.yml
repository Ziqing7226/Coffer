name: Release

# Tag-driven releases: push v* to build six targets reproducibly, checksum
# the archives, sign the checksums keylessly (Sigstore OIDC — no stored
# secrets), generate an SBOM, attest build provenance, and publish a
# GitHub release (pre-release while the version carries a suffix).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # keyless signing and build attestations

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod   # exact toolchain, per go.mod's directive
      - name: Build every platform and pack archives
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            exe=""; [ "$os" = "windows" ] && exe=".exe"
            stage="gitcoffer-${VERSION}-${os}-${arch}"
            mkdir -p "dist/${stage}"
            for cmd in gitcoffer git-remote-coffer; do
              GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/${stage}/${cmd}${exe}" "./cmd/${cmd}"
            done
            ( cd dist
              if [ "$os" = "windows" ]; then
                zip -qr "${stage}.zip" "${stage}"
              else
                tar -czf "${stage}.tar.gz" "${stage}"
              fi
              # Keep the linux-amd64 stage unpacked for the SBOM scan.
              if [ "$target" != "linux/amd64" ]; then
                rm -rf "${stage}"
              fi
            )
          done
          ( cd dist && sha256sum -- *.zip *.tar.gz > checksums.txt )
          ls -la dist
      - name: Install signing and SBOM tools
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 \
            -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          cosign version
          curl --proto '=https' --tlsv1.2 -sSfL "https://github.com/anchore/syft/releases/download/v1.18.0/syft_1.18.0_linux_amd64.tar.gz" \
            -o /tmp/syft.tgz
          tar -xzf /tmp/syft.tgz -C /tmp syft
          mv /tmp/syft /usr/local/bin/syft
          syft version
      - name: Sign the checksums keylessly (Sigstore OIDC)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt
      - name: Generate an SBOM of the linux-amd64 archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          syft scan "dir:gitcoffer-${GITHUB_REF_NAME#v}-linux-amd64" \
            -o spdx-json=gitcoffer-${GITHUB_REF_NAME#v}-sbom.spdx.json
          rm -rf gitcoffer-${GITHUB_REF_NAME#v}-linux-amd64
      - name: Attest build provenance for every archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            *-pre*|*-rc*|*-beta*|*-alpha*) PRE="--prerelease" ;;
            *) PRE="" ;;
          esac
          VERSION="${TAG#v}"
          gh release create "$TAG" dist/gitcoffer-* dist/checksums.txt dist/checksums.txt.sig dist/checksums.txt.pem "dist/gitcoffer-${VERSION}-sbom.spdx.json" \
            $PRE \
            --title "GitCoffer $TAG" \
            --notes "Binaries for Linux, Windows, and macOS (amd64 and arm64). Put \`gitcoffer\` and \`git-remote-coffer\` on PATH; see the [user guide](https://github.com/Ziqing7226/GitCoffer/blob/main/docs/user-guide.md). Integrity: verify archives against \`checksums.txt\` (sha256); the checksums are signed keylessly — verify with \`cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig --certificate-identity-regexp ^https://github.com/Ziqing7226/ --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt\`; an SBOM (spdx-json) and GitHub build attestations (\`gh attestation verify\`) are attached."
